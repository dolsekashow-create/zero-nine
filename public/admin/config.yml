# Zero-Nine admin panel (Sveltia CMS). Every save is a commit to GitHub, and Vercel/Netlify rebuild the site in ~1 minute.
backend:
  name: github
  repo: dolsekashow-create/zero-nine
  branch: main

media_folder: src/assets/projects
public_folder: ../../assets/projects
site_url: https://www.zero--nine.online
locale: ar

collections:
  - name: projects
    label: سابقة الأعمال
    label_singular: مشروع
    folder: src/content/projects
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{order}} · {{name}} — {{tag}}"
    sortable_fields: [order, name]
    media_folder: /src/assets/projects
    public_folder: ../../assets/projects
    fields:
      - { name: name, label: اسم المشروع, widget: string }
      - { name: tag, label: "التصنيف (مثلاً: شركة أثاث)", widget: string, required: false }
      - { name: url, label: رابط الموقع, widget: string, pattern: ['^https?://', 'لازم يبدأ بـ https://'] }
      - { name: image, label: صورة المشروع, widget: image, hint: "يفضّل لقطة شاشة عرضها 1400px تقريباً. الموقع بيصغّرها تلقائياً." }
      - { name: order, label: "الترتيب (1 = الأول)", widget: number, value_type: int, default: 99 }
      - { name: hidden, label: إخفاء من الموقع, widget: boolean, default: false, required: false }

  - name: settings
    label: إعدادات الموقع
    files:
      - name: site
        label: النصوص والأسعار والتواصل
        file: src/data/site.json
        format: json
        fields:
          - name: contact
            label: بيانات التواصل
            widget: object
            fields:
              - { name: whatsapp, label: "رقم الواتساب بالصيغة الدولية (201xxxxxxxxx)", widget: string }
              - { name: phoneDisplay, label: الرقم كما يظهر, widget: string }
              - { name: facebook, label: رابط فيسبوك, widget: string, required: false }
              - { name: email, label: الإيميل, widget: string, required: false }
              - { name: city_ar, label: المدينة (عربي), widget: string }
              - { name: city_en, label: City (English), widget: string }
              - { name: hours_ar, label: ساعات العمل (عربي), widget: string }
              - { name: hours_en, label: Hours (English), widget: string }
          - name: hero
            label: الواجهة الرئيسية
            widget: object
            fields:
              - { name: eyebrow_ar, label: سطر صغير فوق العنوان (عربي), widget: string }
              - { name: eyebrow_en, label: Eyebrow (English), widget: string }
              - { name: title_ar, label: العنوان الرئيسي (عربي), widget: string }
              - { name: highlight_ar, label: الجزء الدهبي من العنوان (عربي), widget: string, hint: لازم يكون مكتوب بنفس الشكل جوه العنوان }
              - { name: title_en, label: Title (English), widget: string }
              - { name: highlight_en, label: Gold part of title (English), widget: string }
              - { name: sub_ar, label: الوصف (عربي), widget: text }
              - { name: sub_en, label: Description (English), widget: text }
          - name: stats
            label: الأرقام
            widget: list
            summary: "{{value}}{{suffix}} {{label_ar}}"
            fields:
              - { name: value, label: الرقم, widget: string }
              - { name: suffix, label: "علامة بعد الرقم (+ أو %)", widget: string, required: false }
              - { name: label_ar, label: الوصف (عربي), widget: string }
              - { name: label_en, label: Label (English), widget: string }
          - { name: worksLabel_ar, label: عنوان قسم الأعمال (عربي), widget: string }
          - { name: worksLabel_en, label: Work label (English), widget: string }
          - name: packages
            label: الباقات
            widget: list
            summary: "{{name_ar}} — {{price}} ج.م"
            fields:
              - { name: name_ar, label: اسم الباقة (عربي), widget: string }
              - { name: name_en, label: Name (English), widget: string }
              - { name: price, label: السعر, widget: string }
              - { name: oldPrice, label: السعر القديم (مشطوب), widget: string, required: false }
              - { name: note_ar, label: مناسبة لمين (عربي), widget: string }
              - { name: note_en, label: Note (English), widget: string }
              - { name: delivery_ar, label: مدة التسليم (عربي), widget: string }
              - { name: delivery_en, label: Delivery (English), widget: string }
              - { name: featured, label: الباقة المميزة (الأكثر طلباً), widget: boolean, default: false }
              - { name: features_ar, label: المميزات (عربي), widget: list, field: { name: item, label: ميزة, widget: string } }
              - { name: features_en, label: Features (English), widget: list, field: { name: item, label: Feature, widget: string } }
          - name: faq
            label: الأسئلة الشائعة
            widget: list
            summary: "{{q_ar}}"
            fields:
              - { name: q_ar, label: السؤال (عربي), widget: string }
              - { name: a_ar, label: الإجابة (عربي), widget: text }
              - { name: q_en, label: Question (English), widget: string }
              - { name: a_en, label: Answer (English), widget: text }
          - name: testimonials
            label: آراء العملاء (القسم بيظهر لما تضيف رأي)
            widget: list
            required: false
            summary: "{{name}}"
            fields:
              - { name: name, label: اسم العميل, widget: string }
              - { name: role_ar, label: الوظيفة/الشركة (عربي), widget: string }
              - { name: role_en, label: Role/company (English), widget: string }
              - { name: quote_ar, label: الرأي (عربي), widget: text }
              - { name: quote_en, label: Quote (English), widget: text }
